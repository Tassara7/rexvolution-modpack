	# Default: 1.1
	# Range: 0.5 ~ 3.0
	followWalkSpeed = 1.1
	#Seguir: velocidade correndo atrás do dono (não gasta energia).
	# Default: 1.6
	# Range: 0.5 ~ 3.0
	followRunSpeed = 1.6
	#Seguir: corre se o dono estiver a mais que isto (volta ao passo 2 blocos antes).
	# Default: 8.0
	# Range: 2.0 ~ 32.0
	followRunDistance = 8.0
	#Seguir: a mais que isto fica para trás e passa a pastar/patrulhar ali.
	# Default: 40.0
	# Range: 16.0 ~ 128.0
	followLoseDistance = 40.0
	#Seguir: ticks longe sem conseguir se aproximar até ficar para trás.
	# Default: 100
	# Range: 20 ~ 1200
