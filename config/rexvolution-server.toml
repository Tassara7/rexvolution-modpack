	#Quantos dinossauros cabem guardados no Compactador.
	# Default: 64
	# Range: 1 ~ 128
	capacity = 64
	#Quantos dinossauros o laser compacta de uma vez (por ciclo).
	# Default: 3
	# Range: 1 ~ 8
	maxPerCycle = 3
	#Altura, em blocos, a que o laser encolhe todos os dinossauros (±10% por bicho).
	# Default: 0.4
	# Range: 0.1 ~ 1.0
	targetHeight = 0.4
	#Duração, em ticks, de encolher (e de crescer ao sair). 40 = 2 segundos.
	# Default: 40
	# Range: 10 ~ 400
	shrinkTicks = 40
	#Tempo máximo, em ticks, para o dinossauro pequeno chegar ao arco; passou disso, entra mesmo assim.
	# Default: 160
	# Range: 20 ~ 1200
	marchTimeoutTicks = 160
	#Ticks do mundo por 1 carga de manutenção (só gasta com dinossauro guardado). 24000 = 1 dia.
	# Default: 24000
	# Range: 1200 ~ 240000
	upkeepTicks = 24000
	#Cargas que 1 pó de redstone põe no tanque.
	# Default: 4
	# Range: 1 ~ 64
	chargesPerRedstone = 4
	#Capacidade do tanque de cargas.
	# Default: 32
	# Range: 4 ~ 256
	tankMax = 32
	#Ticks que o dino leva para entrar/sair andando pelo arco.
