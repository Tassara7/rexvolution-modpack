#Orbe do T-Rex Eclipse (RF22): segurar a tecla de ataque montado carrega, soltar dispara. Dano, raio e empurrão crescem com a carga (linear entre o mínimo, carga mínima, e o máximo, carga cheia). Não quebra blocos, não põe fogo e não atinge o piloto, o dono nem os domados do dono. Vale na hora, também para o ícone de quem joga no servidor.
[eclipseOrb]
	#Tempo para a carga encher, em ticks (20 ticks = 1 segundo). 60 = 3 segundos. Depois disso fica carregado até soltar a tecla.
	# Default: 60
	# Range: 10 ~ 400
	chargeTicks = 60
	#Recarga depois de cada disparo, em ticks. 40 = 2 segundos. Com 0, pode carregar de novo na hora.
	# Default: 40
	# Range: 0 ~ 1200
	cooldownTicks = 40
	#Dano com a carga mínima (em pontos de vida; 2 = 1 coração). 6 = 3 corações. É o dano de quem está no centro da explosão; nas bordas cai até a metade.
	# Default: 6.0
	# Range: 0.0 ~ 100.0
	damageMin = 6.0
	#Dano com a carga cheia. 20 = 10 corações. Se ficar menor que damageMin, os dois são trocados.
	# Default: 20.0
	# Range: 0.0 ~ 100.0
	damageMax = 20.0
	#Raio da explosão com a carga mínima, em blocos (padrão 2).
	# Default: 2.0
	# Range: 0.5 ~ 8.0
	radiusMin = 2.0
	#Raio da explosão com a carga cheia, em blocos (padrão 5). Se ficar menor que radiusMin, os dois são trocados.
	# Default: 5.0
	# Range: 0.5 ~ 8.0
	radiusMax = 5.0
	#Empurrão com a carga mínima, além da repulsão do dano (a repulsão normal do jogo é 0.4). Quem resiste à repulsão é empurrado menos.
	# Default: 0.4
	# Range: 0.0 ~ 5.0
	knockbackMin = 0.4
	#Empurrão com a carga cheia.
	# Default: 1.6
	# Range: 0.0 ~ 5.0
	knockbackMax = 1.6
	#Distância que o orbe percorre, em blocos, antes de explodir (padrão 109).
	# Default: 109.0
	# Range: 4.0 ~ 160.0
	range = 109.0
	#Velocidade do orbe, em blocos por tick (padrão 3.64, uns 73 blocos por segundo).
	# Default: 3.64
	# Range: 0.3 ~ 5.0
	orbSpeed = 3.64
	#Fração da velocidade com que o T-Rex anda montado enquanto o dono segura a tecla (padrão 0.5 = metade).
	# Default: 0.5
	# Range: 0.1 ~ 1.0
	chargeSpeedFactor = 0.5

#Passiva do T-Rex Eclipse (RF22): à noite ele regenera vida e fica mais rápido; o albino tem a mesma passiva também de dia. Vale na hora.
[eclipsePassive]
	#Vida regenerada a cada intervalo (em pontos de vida; 1 = meio coração). Com 0, não regenera.
	# Default: 1.0
	# Range: 0.0 ~ 40.0
