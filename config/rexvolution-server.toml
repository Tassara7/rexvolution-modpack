	enterTicks = 20
	#Ticks que a porta espera aberta depois do último dino passar.
	# Default: 30
	# Range: 0 ~ 200
	doorCloseDelayTicks = 30

#Cérebro de combate da IA (RF341a): escolhe entre usar a habilidade, esperar a recarga na faixa, morder ou recuar.
[combatAi]
	#Ticks entre decisões (cada dino com sua defasagem).
	# Default: 10
	# Range: 1 ~ 100
	decisionInterval = 10
	#Tempo mínimo numa postura antes de trocar (anti-vaivém; usar a habilidade, vida baixa e alvo novo trocam na hora).
	# Default: 30
	# Range: 0 ~ 400
	stanceMinTicks = 30
	#Blocos por tick por unidade de velocidade (jogador 0,1 = 4,32 blocos/s).
	# Default: 2.16
	# Range: 0.1 ~ 10.0
	blocksPerSpeedUnit = 2.16
	#Abaixo desta fração da vida, quem recua ferido fica longe e só morde encurralado.
	# Default: 0.35
	# Range: 0.0 ~ 1.0
	lowHealthFraction = 0.35
	#Vai morder para acabar com o alvo se a vida dele for até isto × o dano da mordida.
	# Default: 2.0
	# Range: 0.0 ~ 20.0
	finishMultiplier = 2.0
	#Selvagens: multiplicador da recarga das habilidades da IA (domados = 1).
	# Default: 2.0
	# Range: 1.0 ~ 20.0
