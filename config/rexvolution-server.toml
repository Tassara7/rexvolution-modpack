#Variação individual (RF05): ao nascer, cada dinossauro sorteia um fator de tamanho e um de velocidade.
#1.0 é o normal da espécie. Só vale para quem nasce depois da mudança: os que já existem mantêm o valor salvo.
[variation]
	#Menor fator de tamanho sorteado ao nascer. Escala e caixa de colisão seguem o fator; vida máxima e dano seguem a raiz dele.
	#Se ficar maior que sizeMax, os dois são trocados (e um aviso vai para o log).
	# Default: 0.65
	# Range: 0.25 ~ 3.0
	sizeMin = 0.65
	#Maior fator de tamanho sorteado ao nascer. Com sizeMin igual a sizeMax, todo dinossauro novo nasce com esse tamanho.
	# Default: 1.35
	# Range: 0.25 ~ 3.0
	sizeMax = 1.35
	#Menor fator de velocidade sorteado ao nascer. Se ficar maior que speedMax, os dois são trocados.
	# Default: 0.8
	# Range: 0.5 ~ 2.0
	speedMin = 0.8
	#Maior fator de velocidade sorteado ao nascer.
	# Default: 1.2
	# Range: 0.5 ~ 2.0
	speedMax = 1.2

#Domar (RF01).
[taming]
	#Chance de domar a cada comida certa: 1 em N. Com 1, a primeira comida já doma.
	# Default: 6
	# Range: 1 ~ 100
	tameChance = 6
	#Fração da vida máxima a partir da qual um carnívoro selvagem está "ferido": fica lento, foge e aceita carne para domar.
	#Também é onde a barra de vida da Lupa fica vermelha.
	# Default: 0.2
	# Range: 0.05 ~ 1.0
	weakHealthFraction = 0.2

#Mordida montada do T-Rex (RF07). Vale na hora, também para o ícone de recarga de quem joga no servidor.
[mountedBite]
	#A mordida montada causa o dano de ataque do T-Rex (já com a variação de tamanho) vezes este fator.
	# Default: 1.5
	# Range: 0.1 ~ 5.0
	damageMultiplier = 1.5
	#Recarga da mordida montada, em ticks (20 ticks = 1 segundo). Com 0, morde a cada aperto.
	# Default: 40
	# Range: 0 ~ 200
	cooldownTicks = 40
	#Alcance base da mordida montada, em blocos. O alcance final soma a largura do T-Rex.
	# Default: 3.0
	# Range: 1.0 ~ 8.0
	baseReach = 3.0

#Golpe de cauda do Estegossauro (RF10). Vale na hora.
[tailSwipe]
	#Recarga do golpe de cauda, em ticks (20 ticks = 1 segundo). Conta só enquanto ele está atacando. Com 0, golpeia assim que o alvo está ao alcance. Vale também para o golpe montado (tecla de ataque montado), que conta em tempo real.
	# Default: 60
	# Range: 0 ~ 200
	cooldownTicks = 60
	#RF53: recarga do golpe de cauda do Estegossauro DOMADO sem cavaleiro (IA), em ticks. O golpe montado e o do selvagem usam a recarga acima.
	# Default: 40
	# Range: 0 ~ 200
	aiCooldownTicks = 40
	#Alcance base do golpe de cauda, em blocos, do centro do Estegossauro ao centro do alvo, no tamanho base da espécie. Vale também para o golpe montado.
	#Estegossauros maiores ou menores (variação de tamanho) alcançam proporcionalmente mais ou menos.
	# Default: 3.0
	# Range: 1.0 ~ 8.0
	baseReach = 3.0

#Chifrada montada do Triceratops (RF16). Vale na hora, também para o ícone de recarga de quem joga no servidor.
[mountedGore]
	#Recarga da chifrada montada, em ticks (20 ticks = 1 segundo). Com 0, chifra a cada aperto.
	# Default: 30
	# Range: 0 ~ 1200
	cooldownTicks = 30
	#RF53: recarga da chifrada do Triceratops DOMADO sem cavaleiro (IA), em ticks. A chifrada montada usa a recarga acima.
	# Default: 30
	# Range: 0 ~ 1200
	aiCooldownTicks = 30
	#Alcance base da chifrada montada, em blocos, além do corpo: o alcance final, de centro a centro, soma a metade da largura do Triceratops e a metade da largura do alvo.
	#Só atinge quem está à frente, num cone de 90 graus. O dano é o ataque do Triceratops e a repulsão é a dele.
	# Default: 3.0
	# Range: 1.0 ~ 8.0
	baseReach = 3.0

#Jato do T-Rex de Fogo (RF18): o lança-chamas que substitui a mordida. Vale na hora, também para a barra de chama de quem joga no servidor.
[fireBreath]
	#Duração da carga cheia em jato contínuo, em ticks (20 ticks = 1 segundo). 80 = 4 segundos.
	# Default: 80
	# Range: 10 ~ 1200
	durationTicks = 80
	#Tempo para encher a carga do vazio ao cheio, em ticks. Começa assim que ele para de baforar. Na água ou na chuva não recarrega. 120 = 6 segundos.
	# Default: 120
	# Range: 10 ~ 2400
	rechargeTicks = 120
	#Dano de cada golpe do jato (em pontos de vida; 2 = 1 coração). Vale para as cores comuns.
	# Default: 3.0
	# Range: 0.0 ~ 40.0
	damage = 3.0
	#Dano de cada golpe do jato azul do albino.
	# Default: 4.5
	# Range: 0.0 ~ 40.0
	albinoDamage = 4.5
	#Alcance do jato, em blocos, contados da boca (padrão 10; vai até 16). Quem já tem o arquivo de configuração de uma versão antiga mantém o valor salvo (6): apague a linha ou o arquivo para voltar ao padrão.
	# Default: 10.0
	# Range: 1.0 ~ 16.0
	range = 10.0
	#Abertura TOTAL do cone do jato, em graus (30 = 15 graus para cada lado da direção em que ele aponta). Até a versão RF18 este valor era a abertura de cada lado; agora é a abertura toda. O dano e o desenho do jato usam o mesmo cone.
	# Default: 30
	# Range: 10 ~ 160
	coneDegrees = 30
	#De quantos em quantos ticks o jato causa dano enquanto está ligado (10 = a cada meio segundo). Também é de quanto em quanto tempo ele procura vítimas.
	# Default: 10
	# Range: 1 ~ 100
	hitIntervalTicks = 10
	#Se ligado, o jato também acende fogo no bloco que atinge, de vez em quando, mas só com a regra mobGriefing ligada.
	burnsBlocks = false

#Rugido sônico do T-Rex do Rock (RF21): no lugar da mordida quando montado (tecla de ataque montado). Vale na hora, também para o ícone de recarga de quem joga no servidor.
[rockRoar]
	#Recarga do rugido, em ticks (20 ticks = 1 segundo). 60 = 3 segundos. Com 0, ruge a cada aperto.
	# Default: 60
	# Range: 0 ~ 1200
	cooldownTicks = 60
	#Dano TOTAL do rugido em cada alvo do cone (em pontos de vida; 2 = 1 coração): cada um dos 3 anéis dá 1/3. 4 = 2 corações.
	# Default: 10.4
	# Range: 0.0 ~ 40.0
	damage = 10.4
	#Alcance do rugido, em blocos, contados da boca (padrão 10).
	# Default: 10.0
	# Range: 1.0 ~ 16.0
	range = 10.0
	#Abertura TOTAL do cone do rugido, em graus (60 = 30 graus para cada lado da direção em que o piloto olha). Não atinge o piloto, o dono nem os domados do dono.
	# Default: 60
	# Range: 10 ~ 160
	coneDegrees = 60
	#Força TOTAL do empurrão do rugido, além da repulsão do dano (padrão 1.6; cada um dos 3 anéis dá 1/3; a repulsão normal do jogo é 0.4 por golpe). Quem resiste à repulsão é empurrado menos.
	# Default: 1.6
	# Range: 0.0 ~ 5.0
	knockback = 1.6
	#Quanto tempo quem foi atingido fica com Lentidão II, em ticks (60 = 3 segundos). Com 0, não aplica o efeito.
	# Default: 60
	# Range: 0 ~ 600
	slownessTicks = 60
	#Multiplicador da mordida do T-Rex do Rock sem piloto sobre a mordida do T-Rex (1.3 = 30% a mais).
	# Default: 1.3
	# Range: 1.0 ~ 3.0
	biteMultiplier = 1.3

#Onda pop do T-Rex do Pop (RF60): o mesmo rugido do Rock (3 anéis), mas num cone mais estreito e mais longo. No lugar da mordida quando montado. Sem piloto, a mordida usa o multiplicador do Rock (rockRoar.biteMultiplier). Vale na hora.
[popRoar]
	#Recarga da onda, em ticks (20 ticks = 1 segundo). 60 = 3 segundos. Com 0, ruge a cada aperto.
	# Default: 60
	# Range: 0 ~ 1200
	cooldownTicks = 60
	#Dano TOTAL da onda em cada alvo do cone (em pontos de vida; 2 = 1 coração): cada um dos 3 anéis dá 1/3. 10.4 = 5,2 corações.
	# Default: 10.4
	# Range: 0.0 ~ 40.0
	damage = 10.4
	#Alcance da onda, em blocos, contados da boca (padrão 22).
	# Default: 22.0
	# Range: 1.0 ~ 48.0
	range = 22.0
	#Abertura TOTAL do cone da onda, em graus (30 = 15 graus para cada lado da direção em que o piloto olha). Não atinge o piloto, o dono nem os domados do dono.
	# Default: 30
	# Range: 10 ~ 160
	coneDegrees = 30
	#Força TOTAL do empurrão da onda, além da repulsão do dano (padrão 1.6; cada um dos 3 anéis dá 1/3).
	# Default: 1.6
	# Range: 0.0 ~ 5.0
	knockback = 1.6
	#Quanto tempo quem foi atingido fica com Lentidão II, em ticks (60 = 3 segundos). Com 0, não aplica o efeito.
	# Default: 60
	# Range: 0 ~ 600
	slownessTicks = 60

#T-Rex de Netherite (RF62): atributos e o ovo do bastião. O ovo esquenta com o jato do T-Rex de Fogo e choca sozinho.
[netheriteTRex]
	#Vida máxima base do T-Rex de Netherite (o T-Rex tem 200; 300 = 150 corações). Vale ao nascer ou carregar.
	# Default: 300.0
	# Range: 20.0 ~ 2048.0
	maxHealth = 300.0
	#Armadura do T-Rex de Netherite (10 = 5 escudos). Vale ao nascer ou carregar.
	# Default: 10.0
	# Range: 0.0 ~ 30.0
	armor = 10.0
	#Velocidade do T-Rex de Netherite em relação à do T-Rex (0.7 = 70%), andando, correndo e montado. Vale ao nascer ou carregar.
	# Default: 0.7
	# Range: 0.2 ~ 2.0
	speedMultiplier = 0.7
	#Quanto tempo o jato do T-Rex de Fogo precisa acertar o ovo para ele ficar quente, em ticks (40 = 2 segundos).
	# Default: 40
	# Range: 1 ~ 1200
	heatTicks = 40
	#Depois de quente, quanto tempo o ovo leva para chocar, em ticks (200 = 10 segundos). Não volta atrás.
	# Default: 200
	# Range: 20 ~ 72000
	hatchTicks = 200
	#Pisão (RF183): ticks segurando R para virar pisão ao soltar (antes disso é toque = mordida).
	# Default: 6
	# Range: 2 ~ 40
	stompHoldTicks = 6
	#Pisão (RF183): recarga do pisão, em ticks (100 = 5 segundos).
	# Default: 100
	# Range: 0 ~ 1200
	stompCooldownTicks = 100
	#Pisão (RF183): dano em área ao redor do T-Rex de Netherite.
	# Default: 22.0
	# Range: 0.0 ~ 1000.0
	stompDamage = 22.0
	#Pisão (RF183): raio da onda de choque no chão, em blocos.
	# Default: 5.0
	# Range: 1.0 ~ 16.0
	stompRadius = 5.0
	#Pisão (RF183): força do empurrão para fora e para cima.
	# Default: 1.4
	# Range: 0.0 ~ 5.0
	stompKnockback = 1.4

#Triceratops do Fim (RF63a): atributos em relacao ao Triceratops, frutas do chorus para transformar e a habilidade de carga com teleporte (RF63b).
[endTriceratops]
	#Vida máxima base do Triceratops do Fim em relação à do Triceratops configurado (1.25 = 25% a mais). Vale ao nascer ou carregar.
